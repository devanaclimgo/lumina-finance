<div class="relative inline-flex items-center rounded-full border border-border bg-muted/60 p-1" role="tablist" aria-label="Workspace">
  <span class="absolute inset-y-1 w-[calc(50%-4px)] rounded-full gradient-primary shadow-[var(--shadow-glow)] transition-transform duration-500 ease-[cubic-bezier(0.22,1,0.36,1)]" [style.transform]="workspace() === 'business' ? 'translateX(100%)' : 'translateX(0)'"></span>

  @for (o of themes; track o.key) {
  <button type="button" role="tab" [attr.aria-selected]="workspace() === o.key" (click)="setWorkspace(o.key)" class="relative z-10 inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold transition-colors duration-300 sm:px-4" [class.text-primary-foreground]="workspace() === o.key" [class.text-muted-foreground]="workspace() !== o.key">
    @if (o.key === 'personal') {
    <svg LucideUser class="h-3.5 w-3.5"></svg>
    } @else {
    <svg LucideBriefcase class="h-3.5 w-3.5"></svg>
    }
    <span class="hidden sm:inline">{{ o.label }}</span>
  </button>
  }
</div>
