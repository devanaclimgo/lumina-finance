<div class="flex flex-col items-center justify-center rounded-xl border border-dashed border-border/80 px-6 py-12 text-center">
  <div class="mb-3 grid h-12 w-12 place-items-center rounded-full bg-accent text-accent-foreground">
    <ng-content select="[empty-icon]" />
  </div>

  <p class="font-medium">
    {{ title }}
  </p>

  @if (description) {
  <p class="mt-1 max-w-sm text-sm text-muted-foreground">
    {{ description }}
  </p>
  }

  <div class="mt-4">
    <ng-content select="[empty-action]" />
  </div>
</div>
