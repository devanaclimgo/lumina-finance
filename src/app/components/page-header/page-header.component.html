<div
  class="animate-rise grid grid-cols-[minmax(0,1fr)_auto] items-start gap-4 sm:flex sm:flex-wrap sm:items-center sm:justify-between"
>
  <div class="min-w-0">
    <h1
      class="truncate text-2xl font-bold tracking-tight sm:text-[28px]"
    >
      {{ title }}
    </h1>

    @if (subtitle) {
      <p class="mt-1 text-sm text-muted-foreground">
        {{ subtitle }}
      </p>
    }
  </div>

  <div
    class="flex shrink-0 flex-wrap items-center gap-2"
  >
    <ng-content select="[header-actions]" />
  </div>
</div>
